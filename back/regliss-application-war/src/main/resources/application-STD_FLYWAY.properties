#Properties file for internal flyway configuration, we dont expose this configuration to the user
spring.flyway.enabled=true
spring.flyway.locations=classpath:\
  db/migration,\
  db/migration-oracle,\
  db/dev-dataset,\
  db/dev-dataset-oracle
#server.error.whitelabel.enabled=false

#Migrate even though non empty schema without metadata table (CONFIG_PARAMS are created before flyway init)
spring.flyway.baseline-on-migrate=true
